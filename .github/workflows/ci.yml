name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test MHRS-OtomatikRandevu.Tests --nologo

      - name: Linux tek dosya derlemesi
        run: |
          dotnet publish MHRS-OtomatikRandevu/MHRS-OtomatikRandevu.csproj -c Release -r linux-x64 \
            --self-contained true -p:PublishSingleFile=true --nologo -o publish
          ls -la publish/MHRS-OtomatikRandevu
